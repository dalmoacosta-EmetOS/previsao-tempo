<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Política de segurança (ADR-040): só carrega código do próprio site e só conversa com os serviços listados -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://tilecache.rainviewer.com; connect-src 'self' https://api.open-meteo.com https://air-quality-api.open-meteo.com https://geocoding-api.open-meteo.com https://api-bdc.io https://api.bigdatacloud.net https://api.rainviewer.com https://api.weather.gov https://router.project-osrm.org https://overpass-api.de https://photon.komoot.io https://qrpuodtyevkemaykfpgn.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Weather Forecast</title>
  <meta name="description" content="Weather Forecast — weather now, hourly, 7 and 15 days, radar and road-trip weather. Previsão do tempo · Pronóstico del tiempo.">
  <meta name="theme-color" content="#0f1e30">
  <!-- Instalar na tela inicial (ADR-034) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Weather">
  <!-- Prévia ao compartilhar o link (WhatsApp, iMessage, redes) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Weather Forecast">
  <meta property="og:description" content="Now, hourly, 15 days, radar, alerts and road-trip weather. Free, no ads. · Agora, por hora, radar e viagem. Grátis e sem anúncios.">
  <meta property="og:image" content="https://dalmoacosta-emetos.github.io/previsao-tempo/img/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://dalmoacosta-emetos.github.io/previsao-tempo/">
  <meta property="og:locale" content="pt_BR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='26' cy='24' r='12' fill='%23FFC83D'/%3E%3Cpath d='M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 50z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css?v=6.3.0">
</head>
<body data-scene="cloudy" data-time="day" class="is-booting">

  <!-- Céu animado: muda conforme o clima da cidade -->
  <div class="sky" aria-hidden="true">
    <div class="sky__sun"></div>
    <div class="sky__stars"></div>
    <div class="sky__clouds"><span></span><span></span><span></span></div>
    <div class="sky__fog"></div>
    <div class="sky__precip" id="precip"></div>
    <div class="sky__flash"></div>
  </div>

  <div class="progress" id="progress" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="./" aria-label="Weather Forecast — início" data-i18n-attr="aria-label:top.home">
        <svg viewBox="0 0 64 64" width="28" height="28" aria-hidden="true"><circle cx="26" cy="24" r="12" fill="#FFC83D"/><path d="M20 50h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 50z" fill="#fff"/></svg>
        <span>Weather<span class="brand__light"> Forecast</span></span>
      </a>

      <div class="search" id="search">
        <svg class="search__icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false" autocorrect="off" autocapitalize="off"
               placeholder="Buscar cidade" aria-label="Buscar cidade" data-i18n-attr="placeholder:top.search;aria-label:top.search"
               role="combobox" aria-expanded="false" aria-controls="search-list" aria-autocomplete="list">
        <ul class="search__list" id="search-list" role="listbox" hidden></ul>
      </div>

      <button class="icon-btn" id="locate-btn" type="button" title="Usar minha localização" aria-label="Usar minha localização" data-i18n-attr="title:top.locate;aria-label:top.locate">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <button class="icon-btn lang-btn" id="lang-btn" type="button"></button>
      <button class="icon-btn account-btn" id="account-btn" type="button" aria-label="Sua conta" data-i18n-attr="aria-label:acc.open;title:acc.open"></button>

      <div class="segmented" role="group" aria-label="Unidade de temperatura" data-i18n-attr="aria-label:top.tempUnit">
        <button type="button" data-unit="C" aria-pressed="true">°C</button>
        <button type="button" data-unit="F" aria-pressed="false">°F</button>
      </div>
    </div>
    <!-- Barra fixa com a cidade: aparece quando o bloco principal sai da tela -->
    <button class="citybar__trip" id="trip-jump" type="button" data-i18n-attr="aria-label:trip.jump;title:trip.jump" tabindex="-1"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 19c4 0 4-6 8-6s4 6 8 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="4" cy="19" r="2" fill="currentColor"/><path d="M20 5c-1.7 0-3 1.3-3 3 0 2.2 3 5 3 5s3-2.8 3-5c0-1.7-1.3-3-3-3z" fill="currentColor"/></svg></button>
    <button class="citybar" id="citybar" type="button" aria-label="Voltar ao topo" data-i18n-attr="aria-label:nav.toTop" tabindex="-1"></button>
    <!-- Idioma e unidades (ADR-045) -->
    <section class="settings" id="settings" aria-labelledby="set-title" hidden></section>
    <!-- Conta opcional: Casa, favoritas e viagens em todos os aparelhos (ADR-051) -->
    <section class="settings account" id="account" aria-labelledby="acc-title" hidden></section>
  </header>

  <main class="layout" id="app">
    <section class="welcome" id="welcome" aria-label="Boas-vindas" data-i18n-attr="aria-label:welcome.aria">
      <p class="welcome__hi" id="greeting"></p>
    </section>
    <nav class="favs" id="favs" aria-label="Cidades favoritas" data-i18n-attr="aria-label:fav.aria" hidden></nav>
    <section class="hero" id="current" aria-live="polite"></section>
    <div id="status"></div>
    <section id="alerts" class="alerts" aria-label="Avisos" data-i18n-attr="aria-label:sec.alerts"></section>
    <!-- 6.0: o planejador de viagem (o diferencial) vem logo depois da temperatura e dos avisos -->
    <section id="trip" class="card card--wide trip trip--hero" aria-label="Tempo na viagem" data-i18n-attr="aria-label:sec.trip"></section>
    <section id="hourly" class="card card--wide" aria-label="Previsão por hora" data-i18n-attr="aria-label:sec.hourly"></section>
    <section id="radar" class="card card--wide" aria-label="Radar de chuva" data-i18n-attr="aria-label:sec.radar"></section>
    <section id="daily" class="card" aria-label="Previsão diária" data-i18n-attr="aria-label:sec.daily"></section>
    <section id="details" class="card" aria-label="Detalhes de hoje" data-i18n-attr="aria-label:sec.details"></section>
  </main>

  <footer class="footer">
    <button class="to-top" id="to-top" type="button" aria-label="Voltar ao topo da página" data-i18n-attr="aria-label:footer.toTopAria">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5l-7 7M12 5l7 7M12 5v14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span data-i18n="nav.toTop">Voltar ao topo</span>
    </button>
    <p><span data-i18n="footer.forecast">Dados de previsão:</span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> <span data-i18n="footer.nonCommercial">(uso não comercial)</span> · <span data-i18n="footer.names">Nome da localização:</span> <a href="https://www.bigdatacloud.com/" target="_blank" rel="noopener">BigDataCloud</a> · <span data-i18n="footer.radar">Radar:</span> <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">Weather data by RainViewer</a> · <span data-i18n="footer.roads">Rotas e postos:</span> <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a></p>
    <p><span data-i18n="footer.builtWithAi">Construído 100% com IA</span> · <a href="https://github.com/dalmoacosta-EmetOS/previsao-tempo" target="_blank" rel="noopener" data-i18n="footer.code">código e documentação</a> · <span id="version"></span></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="demo-badge" id="demo-badge" hidden>DEMO</div>

  <script type="module" src="js/app.js?v=6.3.0"></script>
</body>
</html>
