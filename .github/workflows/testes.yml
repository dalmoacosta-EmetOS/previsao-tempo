# Roda os testes do site a cada envio ao GitHub (ADR-029). Gratuito para repositório público.
name: Testes
on:
  push:
  pull_request:
# Menor permissão possível (ADR-043): os testes só leem o código
permissions:
  contents: read
jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-tela
          path: tests/shots/
