# Varredura automática de segurança do código (GitHub CodeQL) — ADR-043.
# Gratuita para repositório público. Procura falhas como injeção de código (XSS),
# uso inseguro de dados vindos de fora e padrões perigosos. Resultado: aba Security → Code scanning.
name: Segurança (CodeQL)
on:
  push:
    # main + ramos de trabalho: o main é protegido (ruleset "proteger-main") e só aceita
    # commits que já passaram em e2e e analyze num ramo trabalho/…
    branches: [main, 'trabalho/**']
  pull_request:
  schedule:
    - cron: '17 9 * * 1'   # toda segunda-feira, além de cada envio
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
